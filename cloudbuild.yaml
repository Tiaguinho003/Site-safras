# Cloud Build pipeline — roda em cada push para main.
# Instala deps, builda Astro e faz deploy pro Firebase Hosting.
#
# SA de execução: cloud-build-deployer@site-safras.iam.gserviceaccount.com
# Roles concedidas (ver IAM do projeto site-safras):
#   - roles/cloudbuild.builds.builder
#   - roles/firebasehosting.admin
#   - roles/firebase.viewer
#   - roles/logging.logWriter

serviceAccount: "projects/site-safras/serviceAccounts/cloud-build-deployer@site-safras.iam.gserviceaccount.com"

steps:
  - name: "node:22"
    id: "install-build-deploy"
    entrypoint: "bash"
    env:
      # MAINTENANCE=0 → scripts/apply-maintenance.mjs vira no-op, site
      # completo é deployado. Pra reativar manutenção: trocar pra "1".
      - "MAINTENANCE=0"
      # PUBLIC_WEB3FORMS_KEY: chave pública do Web3Forms usada pelo form
      # de contato (#contato). Pública por design — fica no bundle do
      # client de qualquer jeito; domínio whitelistado no painel deles.
      - "PUBLIC_WEB3FORMS_KEY=19f84f64-a60b-4447-a0d6-a858ba8a0482"
      # PUBLIC_GA4_MEASUREMENT_ID: ID de medição do GA4 (G-XXXXXXXXXX).
      # VAZIA de propósito: enquanto estiver assim, nenhum script de medição
      # é emitido e a política de privacidade continua declarando que o site
      # não mede audiência. Preencher acende as duas coisas no mesmo deploy.
      #
      # AO PREENCHER, no MESMO commit: atualizar `privacy.updatedAt` nos três
      # dicionários (src/i18n/*.ts). O texto da política troca sozinho; a data
      # não, e a própria política promete que ela muda junto.
      - "PUBLIC_GA4_MEASUREMENT_ID="
      # PUBLIC_GSC_VERIFICATION: código da meta tag de verificação do Search
      # Console. Vazia = meta não é emitida.
      - "PUBLIC_GSC_VERIFICATION="
    args:
      - "-c"
      - |
        set -euo pipefail
        corepack enable pnpm
        corepack prepare pnpm@10 --activate
        pnpm install --frozen-lockfile
        pnpm build
        pnpm exec firebase deploy --only=hosting --project=site-safras --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
  # Sem machineType explícito → usa default e2-medium (elegível ao free tier
  # de 120 build-minutes/dia). Build é um pouco mais lento (~6-10 min em vez
  # de ~3-5 min), mas custo zero em operação normal.

timeout: "1200s"
